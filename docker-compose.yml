services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vocab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: english_vocab
    ports:
      - "5432:5432"
    volumes:
      - vocab_pgdata:/var/lib/postgresql/data
      - ./schema_postgresql_v3.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_vocab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vocab_pgdata:
