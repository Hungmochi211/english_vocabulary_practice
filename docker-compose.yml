services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vocab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: english_vocab_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - vocab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_vocab_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vocab_pgdata:
