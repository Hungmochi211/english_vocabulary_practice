openapi: 3.0.3
info:
  title: English Vocabulary Practice - Core Backend API (002-backend-core)
  description: >
    Hợp đồng RESTful API cho xác thực người dùng, học theo chu trình 2 bước, sinh đề & chấm điểm thông minh,
    ôn tập ngắt quãng SuperMemo SM-2 / 5 Hộp Leitner, thống kê Streak và tác vụ nhắc học 20:00.
    Tuân thủ cấu trúc phản hồi thống nhất theo Hiến pháp Điều IV.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

tags:
  - name: Auth
    description: Đăng ký, đăng nhập, Google OAuth, đổi mật khẩu, xoay vòng token
  - name: Users
    description: Hồ sơ cá nhân & quản trị người dùng
  - name: Learning
    description: Lộ trình học, Bước 1 Học nạp, Bước 2 Học áp dụng & Kiểm tra tổng hợp
  - name: Reviews
    description: Ôn tập dài hạn theo thuật toán SuperMemo SM-2 & 5 Hộp Leitner
  - name: Stats
    description: Thống kê Streak, biểu đồ 7 ngày và phân bố Hộp Leitner

paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản bằng Email & Mật khẩu
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: Phải chứa ít nhất 1 chữ cái và 1 chữ số
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '201':
          description: Đăng ký thành công, cấp cặp Access Token + Refresh Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Đăng nhập bằng Email & Mật khẩu
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 72
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /auth/google:
    post:
      summary: Đăng nhập một chạm bằng Google ID Token (OAuth 2.0)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Xác thực Google thành công (tạo mới hoặc liên kết tài khoản cùng email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /auth/refresh:
    post:
      summary: Làm mới phiên đăng nhập (Refresh Token Rotation + Reuse Detection)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Cấp cặp Access Token & Refresh Token mới, vô hiệu hóa mã cũ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /auth/logout:
    post:
      summary: Đăng xuất phiên hiện tại (thu hồi ngay Refresh Token)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Đăng xuất thành công (access token cũ hết hạn tự nhiên tối đa 15 phút)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/change-password:
    post:
      summary: Đổi mật khẩu và thu hồi ngay toàn bộ phiên trên mọi thiết bị
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        '200':
          description: Đổi mật khẩu thành công, tăng token_version và thu hồi mọi token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /users/me:
    get:
      summary: Lấy thông tin hồ sơ cá nhân của người dùng đang đăng nhập
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin hồ sơ người học
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      summary: Cập nhật họ tên, ảnh đại diện, mục tiêu CEFR và tùy chọn email nhắc học
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 100
                avatarUrl:
                  type: string
                  format: uri
                  maxLength: 500
                  nullable: true
                targetLevel:
                  type: string
                  enum: [A1, A2, B1, B2]
                emailReminderEnabled:
                  type: boolean
      responses:
        '200':
          description: Cập nhật hồ sơ thành công
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /learning/lessons:
    get:
      summary: Lấy danh sách bài học kèm trạng thái mở khóa, hoàn thành & điểm cao nhất của người học
      tags: [Learning]
      security:
        - bearerAuth: []
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [A1, A2, B1, B2]
        - name: topicId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Danh sách bài học kèm `isUnlocked`, `acquisitionCompleted`, `isCompleted`, `bestScore`
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /learning/lessons/{lessonId}/cards/{vocabularyId}/open:
    post:
      summary: Ghi nhận học viên đã mở 1 thẻ từ vựng trong Bước 1 (Học nạp)
      tags: [Learning]
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
        - name: vocabularyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Trả về số thẻ đã mở, tổng số thẻ và cờ `acquisitionCompleted`
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /learning/lessons/{lessonId}/practice/start:
    post:
      summary: Bắt đầu Bước 2 (Học áp dụng) — sinh đề bài tập cho toàn bộ từ trong bài học
      tags: [Learning]
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Trả về `attemptId` và danh sách câu hỏi (ẩn đáp án đúng)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptStartResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /learning/quizzes/mixed/start:
    post:
      summary: Sinh bài Kiểm tra tổng hợp bằng Stratified Sampling trên các chủ đề đã học
      tags: [Learning]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totalQuestions:
                  type: integer
                  minimum: 5
                  maximum: 40
                  default: 20
      responses:
        '201':
          description: Trả về `attemptId` và danh sách câu hỏi phân tầng đều theo chủ đề
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptStartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /learning/quizzes/{attemptId}/submit:
    post:
      summary: Nộp bài tập thực hành / ôn tập SM-2 / kiểm tra tổng hợp để chấm điểm & cập nhật SM-2, Streak
      tags: [Learning]
      security:
        - bearerAuth: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [vocabularyId, responseTimeMs]
                    properties:
                      vocabularyId:
                        type: integer
                      userAnswer:
                        type: string
                        nullable: true
                        maxLength: 100
                      responseTimeMs:
                        type: integer
                        minimum: 0
                        maximum: 300000
      responses:
        '200':
          description: Kết quả chi tiết từng câu, tổng điểm %, trạng thái mở khóa bài kế tiếp, SM-2 & Streak
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /reviews/due:
    get:
      summary: Lấy danh sách từ vựng đến hạn ôn tập SM-2 hôm nay (UTC+7)
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Trả về `totalDue` và danh sách thẻ sắp xếp theo `leitnerBox ASC, nextReviewDate ASC`
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /reviews/session/start:
    post:
      summary: Khởi tạo 1 phiên ôn tập SM-2 cho các từ đến hạn hôm nay
      tags: [Reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 20
      responses:
        '201':
          description: Trả về `attemptId` và câu hỏi ôn tập (nộp qua `/learning/quizzes/{attemptId}/submit`)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /stats/overview:
    get:
      summary: Lấy thống kê chuỗi ngày học (Streak), phân bố 5 Hộp Leitner và biểu đồ 7 ngày gần nhất
      tags: [Stats]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Số liệu thống kê cá nhân theo múi giờ UTC+7
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /stats/leaderboard:
    get:
      summary: Lấy Bảng xếp hạng tuần (7 ngày gần nhất theo UTC+7) đồng bộ từ dữ liệu thực của người học
      tags: [Stats]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Số lượng học viên tối đa hiển thị trong bảng xếp hạng (1..50, mặc định 20)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Danh sách học viên xếp hạng giảm dần theo weeklyXp, streakDays, wordsThisWeek (không rò rỉ email/thông tin nhạy cảm; luôn bao gồm người dùng hiện tại kèm thứ hạng thật)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/users:
    get:
      summary: Danh sách học viên phân trang (Chỉ dành cho Admin)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          description: Từ khóa tìm kiếm không phân biệt hoa thường theo họ tên hoặc email
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Danh sách người dùng phân trang
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/users/{userId}/status:
    patch:
      summary: Khóa hoặc mở khóa tài khoản học viên (`isActive`) (Chỉ dành cho Admin)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Cập nhật trạng thái tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/stats:
    get:
      summary: Thống kê tổng quan hệ thống (Chỉ dành cho Admin)
      tags: [Stats]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tổng số học viên, hoạt động học tập hệ thống
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/audit-logs:
    get:
      summary: Truy vấn nhật ký kiểm toán hệ thống (Chỉ dành cho Admin)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Danh sách audit logs phân trang
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /auth/forgot-password:
    post:
      summary: Yêu cầu gửi mã OTP 6 chữ số khôi phục mật khẩu qua email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        '200':
          description: Đã tiếp nhận yêu cầu (phản hồi đồng nhất chống dò email)
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/reset-password:
    post:
      summary: Xác thực OTP 6 chữ số và đặt lại mật khẩu mới (thu hồi toàn bộ phiên cũ)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: '^\d{6}$'
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        '200':
          description: Đặt lại mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /learning/history:
    get:
      summary: Lấy lịch sử các phiên làm bài đã hoàn thành kèm chi tiết từ vựng của học viên
      tags: [Learning]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Danh sách lịch sử làm bài phân trang
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /vocabularies/saved:
    get:
      summary: Lấy danh sách Sổ từ đã lưu của học viên hiện tại
      tags: [SavedWords]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách từ vựng đã lưu

  /vocabularies/{id}/save:
    post:
      summary: Lưu từ vựng vào Sổ từ cá nhân (idempotent)
      tags: [SavedWords]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Đã lưu từ vựng vào Sổ từ
    delete:
      summary: Gỡ từ vựng khỏi Sổ từ cá nhân
      tags: [SavedWords]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Đã gỡ từ vựng khỏi Sổ từ

  /notifications:
    get:
      summary: Lấy danh sách thông báo của học viên hiện tại
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách thông báo kèm số chưa đọc
    post:
      summary: Ghi nhận một thông báo học tập phát sinh cho học viên hiện tại
      tags: [Notifications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title:
                  type: string
                  maxLength: 150
                body:
                  type: string
                  maxLength: 500
                icon:
                  type: string
                  maxLength: 40
                tone:
                  type: string
                  enum: [amber, green, blue, purple]
                targetRoute:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Thông báo vừa tạo
    delete:
      summary: Xóa toàn bộ thông báo của học viên hiện tại
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đã xóa sạch thông báo

  /notifications/read-all:
    patch:
      summary: Đánh dấu tất cả thông báo là đã đọc
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đã đánh dấu đọc toàn bộ

  /notifications/{id}/read:
    patch:
      summary: Đánh dấu một thông báo là đã đọc
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Đã cập nhật trạng thái đọc

  /notifications/{id}:
    delete:
      summary: Xóa một thông báo của học viên hiện tại
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Đã xóa thông báo

  /support/messages:
    get:
      summary: Lấy lịch sử tin nhắn hỗ trợ của học viên hiện tại
      tags: [Support]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mảng tin nhắn trao đổi với Quản trị viên
    post:
      summary: Học viên gửi tin nhắn hỗ trợ
      tags: [Support]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '201':
          description: Tin nhắn vừa gửi kèm tin xác nhận tự động (nếu có)

  /support/tickets:
    get:
      summary: Lấy danh sách phiếu góp ý của học viên hiện tại
      tags: [Support]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách phiếu góp ý cá nhân
    post:
      summary: Học viên gửi phiếu góp ý / báo lỗi
      tags: [Support]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, email, detail]
              properties:
                category:
                  type: string
                  maxLength: 80
                email:
                  type: string
                  format: email
                detail:
                  type: string
                  minLength: 5
                  maxLength: 2000
      responses:
        '201':
          description: Mã phiếu góp ý (`ticketId`) và thời điểm tiếp nhận

  /admin/support/threads:
    get:
      summary: Danh sách hội thoại hỗ trợ của học viên (Chỉ Admin)
      tags: [AdminSupport]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách hội thoại kèm tin nhắn cuối cùng

  /admin/support/threads/{userId}/messages:
    get:
      summary: Xem toàn bộ tin nhắn hỗ trợ của một học viên (Chỉ Admin)
      tags: [AdminSupport]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Danh sách tin nhắn của học viên đó
    post:
      summary: Quản trị viên trả lời tin nhắn hỗ trợ của học viên
      tags: [AdminSupport]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '201':
          description: Tin nhắn phản hồi vừa lưu

  /admin/support/tickets:
    get:
      summary: Danh sách phiếu góp ý phân trang (Chỉ Admin)
      tags: [AdminSupport]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, resolved]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách phiếu góp ý phân trang

  /admin/support/tickets/{ticketId}/reply:
    patch:
      summary: Quản trị viên phản hồi và đóng phiếu góp ý
      tags: [AdminSupport]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply:
                  type: string
                  minLength: 1
                  maxLength: 2000
                status:
                  type: string
                  enum: [open, resolved]
                  default: resolved
      responses:
        '200':
          description: Phiếu góp ý sau khi phản hồi

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ (hoặc thiếu từ đã học cho kiểm tra tổng hợp)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Chưa xác thực, token không hợp lệ/thu hồi, hoặc sai thông tin đăng nhập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Không có quyền truy cập, tài khoản bị khóa (`ACCOUNT_DISABLED`), hoặc chưa hoàn tất điều kiện mở khóa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Tài nguyên không tồn tại
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Xung đột trạng thái tài nguyên (email trùng hoặc `ATTEMPT_ALREADY_SUBMITTED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequestsError:
      description: Vượt ngưỡng yêu cầu cho phép (`RATE_LIMIT_EXCEEDED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailableError:
      description: Dịch vụ xác thực Google hoặc Redis tạm thời không khả dụng (`SERVICE_UNAVAILABLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresInSeconds:
              type: integer
              example: 900
            user:
              type: object
        error:
          nullable: true
          example: null

    EmptySuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
          example: null
        error:
          nullable: true
          example: null

    QuizAttemptStartResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            attemptId:
              type: integer
            attemptType:
              type: string
              enum: [lesson_practice, sm2_review, mixed_quiz]
            totalQuestions:
              type: integer
            questions:
              type: array
              items:
                type: object
                properties:
                  vocabularyId:
                    type: integer
                  practiceMode:
                    type: string
                    enum: [multiple_choice, typing, dictation]
                  prompt:
                    type: object
        error:
          nullable: true
          example: null

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
          example: null
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
          required: [code, message, details]
